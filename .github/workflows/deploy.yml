# Publishes the committed build (frontend/dist) to GitHub Pages on every push to main.
# Build locally first: `cd frontend && npx ng build`, then commit dist/ with your changes.
# Data files (frontend/public/data) are fetched from GitHub at runtime, so editing them needs no rebuild.
# Site: https://hassanrazakhalid.github.io/legacy-musallah-prayers/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
